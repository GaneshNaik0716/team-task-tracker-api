version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: task_tracker_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_tracker

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: task_tracker_redis

    ports:
      - "6379:6379"

  api:
    build: .

    container_name: task_tracker_api

    ports:
      - "5000:5000"

    depends_on:
      - postgres
      - redis

    env_file:
      - .env

volumes:
  postgres_data: